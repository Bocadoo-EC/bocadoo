name: Flutter CI (Bocadoo)

on:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'ci/**'
    paths:
      - 'mobile/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/flutter-ci.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'docs/api/openapi.json'
      - '.github/workflows/flutter-ci.yml'
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-sanity:
    name: Validar repositorio y contratos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Validar sintaxis de openapi.json
        run: |
          if [ -f docs/api/openapi.json ]; then
            python3 -m json.tool docs/api/openapi.json > /dev/null
            echo "openapi.json es JSON válido."
          fi

      - name: Verificar ausencia de secretos/keystores versionados
        run: |
          FOUND=$(git ls-files '*.jks' '*.keystore' '**/key.properties' '.env' '.env.*' | grep -v '\.example$' || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Se detectaron archivos sensibles rastreados en Git:"
            echo "$FOUND"
            exit 1
          fi

  flutter-quality:
    name: Análisis estático y pruebas (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Versión de Flutter y Dart
        run: flutter --version

      - name: Descargar dependencias (pub get)
        run: flutter pub get

      - name: Verificar formato (dart format)
        continue-on-error: true
        run: |
          if ! dart format --output=none --set-exit-if-changed lib test; then
            echo "::warning::Hay archivos en lib/ o test/ sin formato estándar (ejecuta 'dart format lib test')."
            exit 1
          fi

      - name: Ejecutar flutter analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos | tee /tmp/analyze_report.txt

      - name: Publicar resumen de análisis
        if: always()
        run: |
          echo "### Flutter Analyze" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 /tmp/analyze_report.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Ejecutar flutter test con cobertura
        run: flutter test --coverage --reporter expanded

      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bocadoo-coverage
          path: mobile/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  android-debug-build:
    name: Compilar APK Debug (Android)
    needs: flutter-quality
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=false'
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Cache de Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Descargar dependencias (pub get)
        run: flutter pub get

      - name: Restaurar Gradle Wrapper si fue ignorado por .gitignore
        shell: bash
        run: |
          if [ ! -f android/gradlew ] || [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            GRADLE_VER=$(grep -E 'gradle-[0-9]+\.[0-9]+(\.[0-9]+)?' android/gradle/wrapper/gradle-wrapper.properties | sed -E 's/.*gradle-([0-9]+\.[0-9]+(\.[0-9]+)?).*/\1/' | head -n 1)
            GRADLE_VER=${GRADLE_VER:-9.5.0}
            echo "Generando Gradle wrapper $GRADLE_VER en runner..."
            curl -fsSL "https://services.gradle.org/distributions/gradle-${GRADLE_VER}-bin.zip" -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            mkdir -p /tmp/gw-init
            touch /tmp/gw-init/settings.gradle
            "/tmp/gradle-dist/gradle-${GRADLE_VER}/bin/gradle" -p /tmp/gw-init --no-daemon wrapper --gradle-version "${GRADLE_VER}"
            cp /tmp/gw-init/gradlew android/gradlew
            cp /tmp/gw-init/gradlew.bat android/gradlew.bat
            mkdir -p android/gradle/wrapper
            cp /tmp/gw-init/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar
            chmod +x android/gradlew
          fi

      - name: Compilar APK Debug
        env:
          BOCADOO_API_URL: ${{ vars.BOCADOO_API_URL || 'https://bck-bocadoo.onrender.com' }}
          BOCADOO_SUPPORT_WHATSAPP: ${{ vars.BOCADOO_SUPPORT_WHATSAPP || '' }}
          BOCADOO_SUPPORT_URL: ${{ vars.BOCADOO_SUPPORT_URL || '' }}
        run: |
          flutter build apk --debug \
            --dart-define=BOCADOO_API_URL="${BOCADOO_API_URL}" \
            --dart-define=BOCADOO_SUPPORT_WHATSAPP="${BOCADOO_SUPPORT_WHATSAPP}" \
            --dart-define=BOCADOO_SUPPORT_URL="${BOCADOO_SUPPORT_URL}"

      - name: Subir APK Debug como artifact
        uses: actions/upload-artifact@v4
        with:
          name: bocadoo-android-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
